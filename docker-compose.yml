version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: phishing_db
    environment:
      POSTGRES_USER: trainer
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: phishing_training_portal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainer -d phishing_training_portal"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: phishing_app
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: trainer
      DB_PASSWORD: secure_password
      DB_NAME: phishing_training_portal
    restart: unless-stopped

volumes:
  postgres_data: